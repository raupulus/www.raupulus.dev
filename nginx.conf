server {
    listen 80;
    server_name raupulus.dev www.raupulus.dev;
    return 301 https://raupulus.dev$request_uri;
}

server {
    listen 443 ssl http2;
    server_name raupulus.dev www.raupulus.dev;

    # SSL
    ssl_certificate /etc/letsencrypt/live/raupulus.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/raupulus.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/public/www.raupulus.dev/.output/public;
    index index.html;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.google.com https://www.gstatic.com https://www.googletagmanager.com https://recaptcha.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://api.raupulus.dev https://www.google-analytics.com https://www.googletagmanager.com; frame-src https://www.google.com https://recaptcha.net;" always;
    add_header Strict-Transport-Security "max-age=63072000" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Logs
    access_log /var/log/nginx/raupulus.dev_access.log;
    error_log /var/log/nginx/raupulus.dev_error.log;
}
