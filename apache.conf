<VirtualHost raupulus.dev:80>
    ServerName raupulus.dev
    ServerAlias www.raupulus.dev

    #Redirect permanent / https://raupulus.dev/

    ServerAdmin raul@fryntiz.dev
    DocumentRoot /var/www/public/www.raupulus.dev/.output/public

    <Directory /var/www/public/www.raupulus.dev/.output/public>
        Options +FollowSymLinks
        IndexIgnore */*
        AllowOverride All
        RewriteEngine on

        # Si el directorio o el archivo existe, entonces se usa directamente:
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d

        # otherwise forward it to index.php
        #RewriteRule . index.html
        RewriteRule . /index.html [L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/www.raupulus.dev_error.log
    CustomLog ${APACHE_LOG_DIR}/www.raupulus.dev.log combined
    RewriteCond %{SERVER_NAME} =www.raupulus.dev [OR]
    RewriteCond %{SERVER_NAME} =raupulus.dev
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost raupulus.dev:443>
    ServerName raupulus.dev
    ServerAlias www.raupulus.dev

    ServerAdmin public@raupulus.dev
    DocumentRoot /var/www/public/www.raupulus.dev/.output/public

    <Directory /var/www/public/www.raupulus.dev/.output/public>
        Options +FollowSymLinks
        IndexIgnore */*
        AllowOverride All
        Require all granted
    </Directory>

    ## Todas las rutas válidas están prerenderizadas como archivos (SSG).
    ## Las rutas inexistentes devuelven el 404 real generado por Nuxt
    ## (mejor para SEO que un fallback SPA con estado 200 / soft-404).
    ErrorDocument 404 /404.html

    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf

    ErrorLog ${APACHE_LOG_DIR}/raupulus.dev_error-ssl.log
    CustomLog ${APACHE_LOG_DIR}/raupulus.dev_access-ssl.log combined

    SSLCertificateFile /etc/letsencrypt/live/raupulus.dev/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/raupulus.dev/privkey.pem

    # === TLS ===
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES
    SSLHonorCipherOrder on

    # === Cabeceras de Seguridad ===
    # Notas:
    # - Fuentes e iconos son self-hosted (@nuxt/fonts + SVG), no hace falta permitir fonts.googleapis.com
    # - reCAPTCHA se carga con useRecaptchaNet, sirve desde www.recaptcha.net y www.gstatic.com
    # - GA4 (nuxt-gtag) conecta con *.google-analytics.com y *.analytics.google.com
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.google.com https://www.gstatic.com https://www.googletagmanager.com https://recaptcha.net https://www.recaptcha.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://api.raupulus.dev https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; frame-src https://www.google.com https://recaptcha.net https://www.recaptcha.net; object-src 'none'; base-uri 'self'; form-action 'self' https://api.raupulus.dev; upgrade-insecure-requests"
    Header always set Strict-Transport-Security "max-age=63072000"

    # === Caché de assets con hash (JS/CSS/fuentes generados por Nuxt) ===
    <LocationMatch "^/(_nuxt|_fonts)/">
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
</VirtualHost>

